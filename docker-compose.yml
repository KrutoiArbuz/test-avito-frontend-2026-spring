version: "3.8"

services:
    backend:
        build:
            context: ./backend
        container_name: avito-backend
        ports:
            - "8080:8080"
        environment:
            - NODE_ENV=production
            - PORT=8080
            - HOST=0.0.0.0
        volumes:
            - ./backend/data:/app/data
        networks:
            - avito-network
        depends_on:
            - ollama
        restart: unless-stopped

    frontend:
        build:
            context: ./frontend
            args:
                - VITE_API_BASE_URL=http://localhost:8080
                - VITE_OLLAMA_URL=http://localhost:11434
                - VITE_OLLAMA_MODEL=llama3
        container_name: avito-frontend
        ports:
            - "5173:5173"
        depends_on:
            - backend
        networks:
            - avito-network
        restart: unless-stopped

    ollama:
        image: ollama/ollama:latest
        container_name: avito-ollama
        ports:
            - "11434:11434"
        volumes:
            - ollama_data:/root/.ollama
        networks:
            - avito-network
        restart: unless-stopped

networks:
    avito-network:
        driver: bridge

volumes:
    ollama_data:
